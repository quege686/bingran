const MK=D.mk,ML=D.ml,RL=D.rl,SD=D.data,TOT=D.tot;

function lvl(p){if(p<=20)return['头部','b-head'];if(p<=40)return['上游','b-upper'];if(p<=60)return['中游','b-mid'];if(p<=80)return['下游','b-low'];return['尾部','b-tail']}
function clr(p){if(p<=20)return'#4ade80';if(p<=40)return'#a3e635';if(p<=60)return'#fbbf24';if(p<=80)return'#fb923c';return'#f87171'}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmtVal(){return '—'}
// 排名位次百分比：越靠前越小（第1名≈0%，最后一名≈100%）
function rk(p){return(Math.max(0,Math.min(100,100-p))).toFixed(1)}

function doSearch(){
const inp=document.getElementById('searchInput').value.trim();
const res=document.getElementById('results');
if(!inp){res.innerHTML='<div class="not-found"><div class="icon">⚠️</div><p>请输入店铺ID后五位</p></div>';return}
const sd=SD[inp];
if(!sd){res.innerHTML='<div class="not-found"><div class="icon">🔍</div><p>未找到后五位为 <b>'+esc(inp)+'</b> 的店铺</p><p style="margin-top:6px;font-size:12px">请检查输入是否正确</p></div>';return}
render(inp,sd)
}

function render(k,sd){
const res=document.getElementById('results');
const sp=sd.r.g?sd.r.g.sp:0;
const spR=rk(sp);
const[sl,sc]=lvl(parseFloat(spR));
let h='<div class="store-card"><div class="store-head"><div><h2>'+esc(sd.n)+'</h2><div class="meta"><span>🆔 '+sd.i+'</span><span>🏆 卓枫组 Top商家</span></div></div><div class="score-box"><div class="score">—</div><div class="rank">排名位次: '+spR+'% <span class="badge '+sc+'">'+sl+'</span></div></div></div>';

// Region blocks
const rcodes=['g','e','u'];
for(const rc of rcodes){

if(!rd)continue;
h+='<div class="region-block '+(rc==='e'?'eu':rc==='u'?'us':'')+'"><div class="region-title">'+RL[rc]+'<span class="label">排名位次百分比（越小越靠前）</span></div><div class="metrics-grid">';
for(const mk of MK){
const p=rd[mk+'p']||0;
const r=rk(p);
const[l,c]=lvl(parseFloat(r));
h+='<div class="metric-item"><div class="name">'+ML[mk]+'</div><div class="pct" style="color:'+clr(parseFloat(r))+'">'+r+'%</div><div class="bar-bg"><div class="bar-fill" style="width:'+(100-parseFloat(r))+'%;background:'+clr(parseFloat(r))+'"></div></div><div class="lvl"><span class="badge '+c+'">'+l+'</span></div></div>';
}
h+='</div></div>'
}

// Comparison table - rank position percentiles
h+='<table class="compare-table"><thead><tr><th>指标</th><th>GLO位次</th><th>EU位次</th><th>US位次</th></tr></thead><tbody>';
for(const mk of MK){
const g=sd.r.g||{},e=sd.r.e||{},u=sd.r.u||{};
const gp=rk(g[mk+'p']||0)+'%',ep=rk(e[mk+'p']||0)+'%',up=rk(u[mk+'p']||0)+'%';
h+='<tr><td class="first">'+ML[mk]+'</td><td>'+gp+'</td><td>'+ep+'</td><td>'+up+'</td></tr>';
}
h+='</tbody></table>';

// Analysis
const gAvg=MK.reduce((s,mk)=>s+parseFloat(rk(sd.r.g?sd.r.g[mk+'p']||0:0)),0)/MK.length;
const eAvg=MK.reduce((s,mk)=>s+parseFloat(rk(sd.r.e?sd.r.e[mk+'p']||0:0)),0)/MK.length;
const uAvg=MK.reduce((s,mk)=>s+parseFloat(rk(sd.r.u?sd.r.u[mk+'p']||0:0)),0)/MK.length;
const bestR=gAvg<=eAvg&&gAvg<=uAvg?'glo':eAvg<=uAvg?'欧区':'美国';
const worstR=gAvg>=eAvg&&gAvg>=uAvg?'glo':eAvg>=uAvg?'欧区':'美国';
const prG=rk(sd.r.g?sd.r.g.prp||0:0),prE=rk(sd.r.e?sd.r.e.prp||0:0),prU=rk(sd.r.u?sd.r.u.prp||0:0);

h+='<div class="analysis"><h3>💡 数据分析</h3>';

// Smart analysis with metric combinations
