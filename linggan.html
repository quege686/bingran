<!DOCTYPE html>
<html lang="zh-CN">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#0a0a0f;color:#e0e0e0;min-height:100vh}
.header{background:linear-gradient(135deg,#1a1a2e,#0f3460);padding:30px 20px;text-align:center;border-bottom:2px solid #e94560}
.header h1{font-size:2em;color:#e94560;text-shadow:0 0 20px rgba(233,69,96,0.4)}
.header p{color:#a0a0c0;margin-top:8px;font-size:0.95em}
.ctrl{max-width:900px;margin:20px auto;padding:0 15px}
.ctrl-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px;align-items:center}
.ctrl-label{color:#888;font-size:0.82em;min-width:90px;text-align:right}
.btn{padding:7px 16px;border:1px solid #333;border-radius:20px;cursor:pointer;font-size:0.82em;transition:all .3s;background:#141420;color:#aaa}
.btn:hover{border-color:#e94560;color:#e94560}
.btn.active{background:#e94560;color:#fff;border-color:#e94560}
.btn-go{padding:14px 50px;background:linear-gradient(135deg,#e94560,#0f3460);color:#fff;border:none;border-radius:30px;font-size:1.2em;cursor:pointer;transition:all .3s}
.btn-go:hover{transform:scale(1.05);box-shadow:0 5px 25px rgba(233,69,96,0.4)}
.btn-sm{padding:4px 10px;font-size:0.75em}
.results{max-width:900px;margin:0 auto;padding:0 15px 40px}
.result-card{background:#141420;border:1px solid #222;border-radius:14px;padding:20px;margin-bottom:16px;position:relative;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.result-num{position:absolute;top:-8px;left:15px;background:#e94560;color:#fff;font-size:0.72em;padding:2px 10px;border-radius:10px;font-weight:bold}
.result-dim{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dim-tag{padding:6px 12px;background:#0a0a14;border-radius:8px;border-left:3px solid #333;font-size:0.85em}
.dim-tag .dim-label{color:#666;font-size:0.7em;display:block;margin-bottom:2px}
.dim-tag .dim-val{color:#ddd}
.dim-tag .dim-diff{font-size:0.68em;margin-left:4px}
.dim-tag .dim-cat{font-size:0.66em;margin-left:4px;color:#7a9cc6}
.diff-j{color:#4caf50}.diff-z{color:#ffc107}.diff-k{color:#f44336}
.result-concept{margin-top:12px;padding:14px;background:linear-gradient(135deg,#1a1a2e,#0f3460);border-radius:10px}
.result-concept-label{color:#e94560;font-size:0.76em;margin-bottom:6px}
.result-concept-text{color:#fff;font-size:1.02em;line-height:1.6;font-style:italic}
.result-wv{margin-top:8px;padding:10px;background:#0a0a14;border-radius:8px;border-left:3px solid #0f3460}
.result-wv-label{color:#555;font-size:0.7em;margin-bottom:3px}
.result-wv-text{color:#8bb0ff;font-size:0.8em;line-height:1.5}
.diff-bar{display:inline-flex;align-items:center;gap:3px;margin-top:6px}
.diff-dot{width:10px;height:10px;border-radius:50%;background:#333}
.diff-dot.on{background:#e94560}
.saved-section{max-width:900px;margin:0 auto;padding:0 15px 30px}
.saved-item{background:#0f0f1a;border:1px solid #1a1a2e;border-radius:8px;padding:10px 14px;margin-bottom:8px;font-size:0.85em;color:#999;display:flex;justify-content:space-between;align-items:center}
.saved-item .saved-concept{flex:1;color:#ccc}
.saved-del{color:#666;cursor:pointer;margin-left:10px;font-size:0.9em}
.empty{text-align:center;color:#555;padding:40px}
.tip{text-align:center;color:#555;font-size:0.8em;padding:20px}
.color-swatch{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;margin-right:4px;border:1px solid #444}
</style>
</head>

var selMat='all', selMode='all', selCount=1, selWV='';
var saved=[];

function setMat(v,e){selMat=v;activeBtn(e)}
function setMode(v,e){selMode=v;activeBtn(e)}
function setCount(v,e){selCount=v;activeBtn(e)}
function lockWV(v,e){selWV=v;activeBtn(e)}
function activeBtn(e){e.parentElement.querySelectorAll('.btn').forEach(function(b){b.classList.remove('active')});e.classList.add('active')}

function filterByDiff(arr){
  if(selMode==='all')return arr;
  if(selMode==='简单')return arr.filter(function(x){return x.diff<=2});
  if(selMode==='中等')return arr.filter(function(x){return x.diff==2||x.diff==3});
  if(selMode==='困难')return arr.filter(function(x){return x.diff>=3});
  return arr;
}

function filterMat(arr){
  if(selMat==='all')return arr;
  return arr.filter(function(x){return x.category===selMat});
}

function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}

function diffClass(d){return d<=2?'diff-j':d<=3?'diff-z':'diff-k'}
function diffStar(d){
  var s='';
  for(var i=1;i<=5;i++)s+='<span class="diff-dot'+(i<=d?' on':'')+'"></span>';
  return s;
}

function roll(){
  var mats=filterMat(M);
  var structs=filterByDiff(S);
  var surfs=filterByDiff(P);
  var sils=filterByDiff(F);
  var cols=C;
  var wvs=W;
  var hws=filterByDiff(H);

  if(selMode!=='all'){
    mats=mats.filter(function(x){return selMode==='简单'?x.diff<=2:selMode==='中等'?(x.diff==2||x.diff==3):x.diff>=3});
    cols=cols; // colors don't have difficulty
  }

  if(mats.length===0)mats=filterMat(M);
  if(structs.length===0)structs=S;
  if(surfs.length===0)surfs=P;
  if(sils.length===0)sils=F;
  if(hws.length===0)hws=H;

    wvInfo+='<div style="margin-top:2px"><span style="color:#555;font-size:0.72em">色彩方案：</span><span style="color:#aaa;font-size:0.82em">'+w.palette+'</span></div>';
    wvInfo+='<div style="margin-top:2px"><span style="color:#555;font-size:0.72em">情绪基调：</span><span style="color:#aaa;font-size:0.82em">'+w.mood+'</span></div>';
    wvInfo+='<div style="margin-top:2px"><span style="color:#555;font-size:0.72em">参考视觉：</span><span style="color:#aaa;font-size:0.82em">'+w.ref+'</span></div>';

var conceptList=[];
function saveThis(idx){
  var concept=conceptList[idx];
  saved.unshift(concept);
  renderSaved();
  var btn=event.target;
  btn.textContent='已收藏';
  btn.disabled=true;
}

function renderSaved(){
  document.getElementById('savedCount').textContent=saved.length;
  var html='';
  if(saved.length===0){html='<div class="empty">暂无收藏，投掷骰子后点击收藏按钮保存灵感</div>'}
  else{
    saved.forEach(function(c,i){
      html+='<div class="saved-item"><span class="saved-concept">'+c+'</span><span class="saved-del" onclick="delSaved('+i+')">&#10005;</span></div>';
    });
  }
  document.getElementById('savedList').innerHTML=html;
}

function delSaved(i){saved.splice(i,1);renderSaved()}
function clearSaved(){saved=[];renderSaved()}

renderSaved();
</script>
